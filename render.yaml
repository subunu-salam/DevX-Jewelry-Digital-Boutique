# ───────────────────────────────────────────────────────────────
# Render Blueprint — one-click deploy for DevX Boutique OS
# Creates: managed PostgreSQL + API web service + 2 static sites
# (Customer Boutique and CRM on separate URLs).
# Docs: https://render.com/docs/blueprint-spec
# ───────────────────────────────────────────────────────────────
databases:
  - name: devx-boutique-db
    databaseName: devx_boutique
    user: devx
    plan: free

services:
  # ── API + database source of truth ──────────────────────────
  - type: web
    name: devx-boutique-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build && npx prisma migrate deploy && npm run db:seed
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devx-boutique-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false # set to the two static-site URLs after first deploy
      - key: GOLD_PROVIDER
        value: gold-api

  # ── Customer Digital Boutique (separate URL) ────────────────
  - type: web
    name: devx-boutique-web
    runtime: static
    rootDir: apps/boutique
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # set to https://devx-boutique-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Jeweller CRM (separate URL) ─────────────────────────────
  - type: web
    name: devx-boutique-crm
    runtime: static
    rootDir: apps/crm
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # set to https://devx-boutique-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
